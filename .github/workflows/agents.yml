# Checks the local agent worker (tools/agents). On Linux, npm run check in ci.yml runs the same tests,
# and this workflow runs npm run test:agents once more on Windows, the real environment (#165).
name: agents

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'registry/projects.json'
      - 'scripts/test/agent-*.test.mjs'
      - 'package.json'
      - '.github/workflows/agents.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'registry/projects.json'
      - 'scripts/test/agent-*.test.mjs'
      - 'package.json'
      - '.github/workflows/agents.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false # turned off because there is no lockfile, so the setup-node v5+ auto cache would fail
      - run: npm run test:agents
