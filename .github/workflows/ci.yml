# Checks of the central repo itself: tests, registry conflicts, generated docs and token CSS up to date, package rules, workflow pinning.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false # turned off because there is no lockfile, so the setup-node v5+ auto cache would fail
      # There are no external npm dependencies, so checks run without npm ci.
      - run: npm run check
      - run: node scripts/ioc-scan.mjs
      - run: node scripts/secret-scan.mjs
