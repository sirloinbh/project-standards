# Checks of the central repo itself: tests, registry conflicts, generated docs and token CSS up to date, package rules, workflow pinning, and a PR comment with the downstream file changes (#1056).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request branch cancels that branch's older run. A run on main is never cancelled:
# autodeploy treats a cancelled run of a commit as a failure, so main runs get a group of their own (#873).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false # turned off because there is no lockfile, so the setup-node v5+ auto cache would fail
      # There are no external npm dependencies, so checks run without npm ci.
      - run: npm run check
      - run: node scripts/ioc-scan.mjs
      - run: node scripts/secret-scan.mjs

  # Renders a new app from the scaffold and runs its backend tests, so a new app's first npm test cannot fail
  # unnoticed (#616). The shared packages come from GitHub Packages, so this job reads them with the job token.
  scaffold-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scaffold script looks up the last commit that changed the reusable workflows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: node scripts/scaffold.mjs study-log --out "$RUNNER_TEMP/scaffold"
      # The scaffold has no lockfile yet, so this is npm install; the rendered .npmrc turns install scripts off.
      - run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/scaffold
      - run: npm run test -w backend
        working-directory: ${{ runner.temp }}/scaffold

  # Comments on the pull request which files each downstream repo would receive, change or lose (#1056).
  # Only this job may write to the PR, and it never runs for a pull request from a fork.
  downstream-diff:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Compare the downstream files and comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POST_TARGET: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: node head/scripts/downstream-diff.mjs --base base --head head --work "$RUNNER_TEMP/downstream-diff" --post "$POST_TARGET"
