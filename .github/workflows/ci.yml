# 중앙 리포 자체 검증: 테스트, 레지스트리 충돌, 생성 문서·토큰 CSS 최신 여부, 패키지 규칙, 워크플로 고정.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false # lockfile이 없어 setup-node v5+ 자동 캐시가 실패하므로 끈다
      # 외부 npm 의존성이 없으므로 npm ci 없이 바로 검사한다.
      - run: npm run check
      - run: node scripts/ioc-scan.mjs
      - run: node scripts/secret-scan.mjs
