# Collects the state of the downstream repos every day and regenerates docs/compliance.md and docs/env-matrix.md.
# Opens or updates a PR (chore/compliance-report) in the central repo only when the content changed.
# Skipped when the GitHub App is missing (no vars.SYNC_APP_ID).
name: compliance

on:
  schedule:
    - cron: '0 15 * * *' # every day at 00:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance
  cancel-in-progress: false

jobs:
  report:
    if: vars.SYNC_APP_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false # turned off because there is no lockfile, so the setup-node v5+ auto cache would fail
      - name: Collect compliance status and open report PR
        env:
          SYNC_APP_ID: ${{ vars.SYNC_APP_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: node scripts/compliance.mjs --apply
