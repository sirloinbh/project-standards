# 공유 패키지 배포. 태그 <패키지>/v<버전>을 push하면 GitHub Packages에 배포하고 Release에 기록을 남긴다.
# 로컬 publish는 금지한다(ADR-0004). 태그 push는 사용자가 한다(#88).
name: publish

on:
  push:
    tags: ['*/v*']

permissions:
  contents: write # Release 만들기
  packages: write # GitHub Packages에 배포

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sirloinbh'

      - name: 태그에서 패키지와 버전 읽기
        id: tag
        run: |
          tag='${{ github.ref_name }}'
          echo "package=${tag%%/v*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*/v}" >> "$GITHUB_OUTPUT"

      - name: 중앙 검사 (테스트, 패키지 규칙, 태그와 버전 일치)
        run: |
          npm run check
          node scripts/package-guard.mjs --tag '${{ github.ref_name }}'

      - name: 배포
        working-directory: packages/${{ steps.tag.outputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts

      - name: Release에 배포 기록 남기기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/changelog-section.mjs '${{ steps.tag.outputs.package }}' '${{ steps.tag.outputs.version }}' > changes.md
          {
            echo "## 변경 내용"
            echo
            cat changes.md
            echo
            echo "## 배포 기록"
            echo
            echo "- 패키지: @sirloinbh/${{ steps.tag.outputs.package }}@${{ steps.tag.outputs.version }}"
            echo "- 커밋: ${{ github.sha }}"
            echo "- 배포 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > notes.md
          gh release create '${{ github.ref_name }}' --title '@sirloinbh/${{ github.ref_name }}' --notes-file notes.md --verify-tag
