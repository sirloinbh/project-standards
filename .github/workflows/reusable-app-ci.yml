# Shared CI for app repos. Each app's .github/workflows/ci.yml (a centrally managed file) calls it pinned to a commit SHA.
# For a downstream repo to call this workflow in the private central repo, the central repo needs Settings → Actions → Access set up (docs/github-app.md step 4).
name: reusable-app-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
      npm-version:
        type: string
        required: true
      postgres-image:
        type: string
        required: true
      db-name:
        description: Test DB name used in CI
        type: string
        required: true
      e2e:
        description: Whether to run Playwright browser tests (registry features.e2e)
        type: boolean
        default: false
      e2e-visual:
        description: Run e2e in the pinned Playwright container with E2E_VISUAL=1 and compare screenshots too (registry features.e2eVisual)
        type: boolean
        default: false
      playwright-image:
        description: Playwright image for screenshot comparison, pinned by digest (versions.json images.playwright)
        type: string
        default: ''
      knip-strict:
        description: Fail CI if knip reports anything. Enable only for apps whose result is 0 (registry features.knipStrict, #342)
        type: boolean
        default: false
      push-images:
        description: On pushes to main, build the images once and push them to GHCR (ADR-0023, #754). Off until the private package quota is confirmed (#756)
        type: boolean
        default: false
      image-prefix:
        description: GHCR image name prefix, without the -backend / -frontend suffix, for example ghcr.io/sirloinbh/workout. Used only when push-images is on
        type: string
        default: ''
      image-keep:
        description: How many of the newest image versions to keep per image; older ones are deleted after a push
        type: number
        default: 2

permissions:
  contents: read
  packages: read # install @sirloinbh shared packages

env:
  NODE_AUTH_TOKEN: ${{ github.token }}
  # inputs are never put into the run shell directly, only used as environment variables (prevents script injection).
  NPM_VERSION: ${{ inputs.npm-version }}
  DATABASE_URL: postgres://app:test@localhost:5432/${{ inputs.db-name }}
  TEST_DATABASE_URL: postgres://app:test@localhost:5432/${{ inputs.db-name }}
  E2E_DATABASE_URL: postgres://app:test@localhost:5432/${{ inputs.db-name }}

jobs:
  # A pull request that changes only docs/** or *.md skips the slow e2e and docker-build jobs (#699). verify still runs: it holds the
  # format check, the central standards check, and the docs tests. A skipped job counts as passed for a required check, so branch
  # protection is not left waiting. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - id: docs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the merge commit of the pull request; its first parent is the base.
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: '${{ inputs.db-name }}' }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Supply chain check (before install, based on lockfile)
        run: node .standards/ioc-scan.mjs
      - name: Secret leak check (committed tokens and keys, .env)
        run: node .standards/secret-scan.mjs
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Central standards check
        run: node .standards/check.mjs
      - name: Supply chain check (after install, including node_modules)
        run: node .standards/ioc-scan.mjs
      - name: DB migration
        # Rule: docs/conventions/database.md (#27). The e2e job has the same script (a test checks they match).
        # 1) Like Docker init on an empty volume, apply all files once with psql without recording (checks they are safe to run again).
        # 2) If the shared runner (db:migrate) exists, apply again and record in schema_migrations.
        #    Apps without a runner yet apply once more with psql and only get a warning (compatible with the old behavior).
        run: |
          shopt -s nullglob
          for migration in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
          done
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate'] ? 0 : 1)"; then
            npm run db:migrate
          else
            echo "::warning title=DB migration::There is no db:migrate runner, so migrations were applied with psql only. No applied-migration record is kept. Add a runner following the central docs/conventions/database.md."
            for migration in database/migrations/*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
            done
          fi
      - run: npm run check
      - name: Unused files, exports, and dependencies (knip, warning only)
        # It does not fail at first (#263). Apps whose result reached 0 use the failing step via features.knipStrict (#342).
        if: hashFiles('knip.json') != '' && !inputs.knip-strict
        run: npm run knip || echo "::warning title=knip::There are unused files, exports, or dependencies. Check this step's log."
      - name: Unused files, exports, and dependencies (knip)
        if: hashFiles('knip.json') != '' && inputs.knip-strict
        run: npm run knip
      - name: Accessibility and performance scores (Lighthouse CI, warning only)
        # Only apps with registry features.lighthouse receive lighthouserc.json (#280). It serves the frontend/dist built by npm run check
        # statically and measures it with the runner's Google Chrome. Neither a missed threshold nor a failed measurement stops CI.
        id: lighthouse
        if: hashFiles('lighthouserc.json') != ''
        run: |
          node_modules/.bin/lhci autorun || echo "::warning title=Lighthouse CI::Measuring or checking the threshold scores failed. Check this step's log."
          # The score summary goes to node on standard input, so no shell quoting is involved.
          node - <<'JS'
          const fs = require('node:fs');
          const file = '.lighthouseci/manifest.json';
          if (!fs.existsSync(file)) process.exit(0);
          for (const run of JSON.parse(fs.readFileSync(file, 'utf8')).filter((r) => r.isRepresentativeRun)) {
            const scores = Object.entries(run.summary).map(([k, v]) => `${k} ${Math.round(v * 100)}`).join(', ');
            console.log(`${run.url}: ${scores}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Lighthouse ${run.url}: ${scores}\n`);
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.lighthouse.outcome != 'skipped'
        with: { name: lighthouse-report, path: .lighthouseci, retention-days: 7, if-no-files-found: ignore }
      - name: Deploy script syntax check
        run: |
          shopt -s nullglob
          for f in deploy/*.sh; do bash -n "$f" || exit 1; done

  e2e:
    needs: changes
    # !cancelled() keeps the job running when the changes job failed, so a failure there cannot turn into a skipped (passing) check.
    if: ${{ !cancelled() && inputs.e2e && !inputs.e2e-visual && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: '${{ inputs.db-name }}' }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: DB migration
        # Same script as the step with the same name in the verify job.
        run: |
          shopt -s nullglob
          for migration in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
          done
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate'] ? 0 : 1)"; then
            npm run db:migrate
          else
            echo "::warning title=DB migration::There is no db:migrate runner, so migrations were applied with psql only. No applied-migration record is kept. Add a runner following the central docs/conventions/database.md."
            for migration in database/migrations/*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
            done
          fi
      # Playwright uses the Google Chrome installed on the runner image (ubuntu-24.04) as channel 'chrome'.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # Screenshot comparison: compare against baseline images only in a container with fixed fonts and Chromium.
  e2e-visual:
    needs: changes
    if: ${{ !cancelled() && inputs.e2e && inputs.e2e-visual && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.playwright-image }}
      options: --ipc=host
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: '${{ inputs.db-name }}' }
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_VISUAL: '1'
      # Inside the container, connect to the DB by service name.
      DATABASE_URL: postgres://app:test@postgres:5432/${{ inputs.db-name }}
      TEST_DATABASE_URL: postgres://app:test@postgres:5432/${{ inputs.db-name }}
      E2E_DATABASE_URL: postgres://app:test@postgres:5432/${{ inputs.db-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      # The Playwright image has no psql. The verify job checks with psql that running again is safe.
      - name: DB migration
        run: npm run db:migrate
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Candidate baseline images for screens that are missing or intentionally changed. After checking the differences in playwright-report,
      # commit this artifact to e2e/__screenshots__.
      - if: failure()
        run: npx playwright test --update-snapshots=changed --retries=0 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: visual-baselines, path: e2e/__screenshots__, retention-days: 7 }

  docker-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The package auth token is passed only as a BuildKit secret. It does not stay in image layers.
      - run: docker build --secret id=npm_token,env=NODE_AUTH_TOKEN ./frontend
      - run: docker build --secret id=npm_token,env=NODE_AUTH_TOKEN ./backend

  # Builds the images that production will run and pushes them to GHCR, tagged with the commit (ADR-0023, #754). Only on a push to
  # main, only when the app turns it on, and only after docker-build passed. packages: write is granted to this job alone. A failed
  # retention step never fails the run: the images are pushed, old ones are just not removed yet.
  image-push:
    needs: [changes, docker-build]
    if: ${{ !cancelled() && needs.docker-build.result == 'success' && inputs.push-images && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ inputs.image-prefix }}
      IMAGE_KEEP: ${{ inputs.image-keep }}
      OWNER: ${{ github.repository_owner }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$IMAGE_PREFIX" in ghcr.io/"$OWNER"/?*) ;; *) echo "image-prefix must start with ghcr.io/$OWNER/" >&2; exit 1 ;; esac
          tag=${GITHUB_SHA:0:12}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The source label links each package to this repository. The package auth token is passed only as a BuildKit secret.
          for part in frontend backend; do
            docker build --secret id=npm_token,env=NODE_AUTH_TOKEN --label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE_PREFIX-$part:$tag" "./$part"
            docker push "$IMAGE_PREFIX-$part:$tag"
          done
      - name: Keep only the newest versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for part in frontend backend; do
            name=${IMAGE_PREFIX#ghcr.io/"$OWNER"/}-$part
            # Newest first; everything after the first IMAGE_KEEP versions is deleted.
            gh api --paginate "/users/$OWNER/packages/container/$name/versions" --jq '.[] | [.created_at, .id] | @tsv' |
              sort -r | tail -n +"$((IMAGE_KEEP + 1))" | cut -f2 |
              while read -r id; do gh api -X DELETE "/users/$OWNER/packages/container/$name/versions/$id"; done
          done
