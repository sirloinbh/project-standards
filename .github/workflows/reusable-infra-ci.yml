# Shared CI for the infrastructure repo (shared-aws-infrastructure). It never runs terraform apply (ADR-0005).
name: reusable-infra-ci

on:
  workflow_call:
    inputs:
      terraform-version:
        type: string
        required: true
      node-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false # turned off because npm ci is not run, so the setup-node v5+ auto cache is not needed
      - name: Central standards check
        run: node .standards/check.mjs
      - name: Supply chain check
        run: node .standards/ioc-scan.mjs
      - name: Secret leak check (committed tokens and keys, .env)
        run: node .standards/secret-scan.mjs
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Shell script syntax check
        run: |
          status=0
          while IFS= read -r -d '' script; do bash -n "$script" || status=1; done < <(find . -name '*.sh' -not -path './.terraform/*' -print0)
          exit $status
