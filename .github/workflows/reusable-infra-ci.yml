# 인프라 리포(shared-aws-infrastructure) 공통 CI. terraform apply는 하지 않는다(ADR-0005).
name: reusable-infra-ci

on:
  workflow_call:
    inputs:
      terraform-version:
        type: string
        required: true
      node-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false # npm ci를 하지 않으므로 setup-node v5+ 자동 캐시를 끈다
      - name: 중앙 표준 검사
        run: node .standards/check.mjs
      - name: 공급망 점검
        run: node .standards/ioc-scan.mjs
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: 셸 스크립트 문법 검사
        run: |
          status=0
          while IFS= read -r -d '' script; do bash -n "$script" || status=1; done < <(find . -name '*.sh' -not -path './.terraform/*' -print0)
          exit $status
