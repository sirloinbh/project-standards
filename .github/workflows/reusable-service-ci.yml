# Shared CI for the shared service repos (shared-auth). Each service's .github/workflows/ci.yml (a centrally managed file) calls it pinned to a commit SHA.
# It checks the supply chain and secrets, then installs, type-checks, and tests the Node project in `working-directory`, and builds its Docker image.
name: reusable-service-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
      npm-version:
        type: string
        required: true
      working-directory:
        description: Folder that holds the Node project (package.json, Dockerfile)
        type: string
        default: backend
      push-images:
        description: On pushes to main, build the image once and push it to GHCR (ADR-0023, #757). Off until the private package quota is confirmed (#756)
        type: boolean
        default: false
      image-prefix:
        description: Image path without the part name, for example ghcr.io/sirloinbh/shared-auth; the image is pushed as <image-prefix>-backend
        type: string
        default: ''
      image-keep:
        description: How many image versions to keep in GHCR
        type: number
        default: 2

permissions:
  contents: read
  packages: read

env:
  # inputs are never put into the run shell directly, only used as environment variables (prevents script injection).
  NPM_VERSION: ${{ inputs.npm-version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Central standards check
        working-directory: .
        run: node .standards/check.mjs
      - name: Supply chain check (before install, based on lockfile)
        working-directory: .
        run: node .standards/ioc-scan.mjs
      - name: Secret leak check (committed tokens and keys, .env)
        working-directory: .
        run: node .standards/secret-scan.mjs
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Shell script syntax check
        working-directory: .
        run: |
          status=0
          while IFS= read -r -d '' script; do bash -n "$script" || status=1; done < <(find . -name '*.sh' -not -path '*/node_modules/*' -print0)
          exit $status

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build "$WORKDIR"
        env:
          WORKDIR: ${{ inputs.working-directory }}

  # Builds the image that production will run and pushes it to GHCR, tagged with the commit (ADR-0023, #757). Only on a push to
  # main, only when the service turns it on, and only after docker-build passed. packages: write is granted to this job alone.
  # A failed retention step never fails the run: the image is pushed, old ones are just not removed yet.
  image-push:
    needs: [docker-build]
    if: ${{ !cancelled() && needs.docker-build.result == 'success' && inputs.push-images && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ inputs.image-prefix }}
      IMAGE_KEEP: ${{ inputs.image-keep }}
      WORKDIR: ${{ inputs.working-directory }}
      OWNER: ${{ github.repository_owner }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$IMAGE_PREFIX" in ghcr.io/"$OWNER"/?*) ;; *) echo "image-prefix must start with ghcr.io/$OWNER/" >&2; exit 1 ;; esac
          tag=${GITHUB_SHA:0:12}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A network blip (npm ECONNRESET, a registry reset) must not fail main CI and so stop the deploy (#923): try each step up to 3 times.
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n of 3 failed: $1 ${2:-}" >&2; sleep $((n * 10)); done; return 1; }
          retry docker build --label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE_PREFIX-backend:$tag" "$WORKDIR"
          retry docker push "$IMAGE_PREFIX-backend:$tag"
      - name: Keep only the newest versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=${IMAGE_PREFIX#ghcr.io/"$OWNER"/}-backend
          # Newest first; everything after the first IMAGE_KEEP versions is deleted.
          gh api --paginate "/users/$OWNER/packages/container/$name/versions" --jq '.[] | [.created_at, .id] | @tsv' |
            sort -r | tail -n +"$((IMAGE_KEEP + 1))" | cut -f2 |
            while read -r id; do gh api -X DELETE "/users/$OWNER/packages/container/$name/versions/$id"; done
