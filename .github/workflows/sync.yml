# When central main changes, opens or updates a sync PR for each downstream repo at or below maxRollout.
# Skipped before the GitHub App (project-standards-sync) exists (no vars.SYNC_APP_ID) (docs/github-app.md).
name: sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # reads the publish.yml run recorded in the package Release. The App has no Actions permission (#205)

# Syncs run one at a time, in order (a run in progress is not cancelled).
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.SYNC_APP_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history is needed to find the last commit that changed the shared CI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false # turned off because there is no lockfile, so the setup-node v5+ auto cache would fail
      - name: Central checks (no sync if they fail)
        run: npm run check
      - name: Open or update sync PRs
        env:
          SYNC_APP_ID: ${{ vars.SYNC_APP_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # read-only access to the central repo (Release, publish run)
        run: node scripts/sync.mjs --apply
