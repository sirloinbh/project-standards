# 중앙 main이 바뀌면 maxRollout 이하인 하위 리포마다 동기화 PR을 열거나 갱신한다.
# GitHub App(project-standards-sync)이 만들어지기 전(vars.SYNC_APP_ID 없음)에는 건너뛴다(docs/github-app.md).
name: sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 동기화는 한 번에 하나씩, 순서대로 실행한다(진행 중인 실행을 취소하지 않는다).
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.SYNC_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # 공통 CI를 마지막으로 바꾼 커밋을 찾기 위해 전체 이력이 필요하다
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: 중앙 검사 (실패하면 동기화하지 않음)
        run: npm run check
      - name: 동기화 PR 열기·갱신
        env:
          SYNC_APP_ID: ${{ vars.SYNC_APP_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: node scripts/sync.mjs --apply
