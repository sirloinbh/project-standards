services:
  db:
    image: {{versions.images.postgres}}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-{{project.db.name}}}
      POSTGRES_USER: ${POSTGRES_USER:-{{project.db.name}}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:${DB_PORT:-{{project.ports.db}}}:5432']
    volumes:
      - {{project.db.name}}-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets: [npm_token]
    # Tagged by commit on the server so the previous version can be restarted.
    image: {{project.db.name}}-backend:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-{{project.db.name}}}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-{{project.db.name}}}
      PORT: {{project.ports.api}}
      TZ: Asia/Seoul
      # The shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # shared-ai's public key; /internal/tools is served only when it is set (docs/ai-tools.md).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads this app's tools at http://{{project.name}}-api:{{project.ports.api}}/internal/tools (ADR-0017).
      shared-ai: { aliases: [{{project.name}}-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web's depends_on use it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:{{project.ports.api}}/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      secrets: [npm_token]
    image: {{project.db.name}}-frontend:${IMAGE_TAG:-local}
    # Local default stays 127.0.0.1:{{project.ports.web}}; the server sets WEB_BIND/WEB_PORT in .env.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-{{project.ports.web}}}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
volumes:
  {{project.db.name}}-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # Created by deploy/remote-deploy.sh or the shared-ai deploy when missing. Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
